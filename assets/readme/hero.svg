<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">GrooveGrab CLI - Modular Music Downloader &amp; CAVA Audio Player</title>
  <desc id="hero-desc">High-performance CLI music downloader and terminal CAVA audio visualizer with 2-line couplet synchronized lyrics.</desc>

  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="45%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="glow-cyan" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Terminal Window Gradient -->
    <linearGradient id="term-window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111A2E"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>

    <!-- Brand Title Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="badge-pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Spectrum Bar Gradients -->
    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="cyan-bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="term-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    
    <filter id="glow-text" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="460" rx="20" fill="url(#bg-canvas)"/>
  <rect width="1200" height="460" rx="20" fill="url(#glow-cyan)"/>
  <rect width="1200" height="460" rx="20" fill="url(#glow-purple)"/>
  <rect width="1198" height="458" x="1" y="1" rx="19" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Hero Column -->
  <g transform="translate(56, 54)">
    <!-- Version & Engine Badge -->
    <rect width="275" height="30" rx="15" fill="url(#badge-pill)" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="15" cy="15" r="4.5" fill="#00F0FF"/>
    <text x="28" y="19.5" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">⚡ v1.0.0 • CLI AUDIO ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="86" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1.2">GrooveGrab <tspan fill="url(#brand-grad)">CLI</tspan></text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="128" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" line-height="1.5">
      <tspan x="0" dy="0">High-performance song &amp; playlist downloader with a</tspan>
      <tspan x="0" dy="24">full-terminal CAVA visualizer &amp; 2-line couplet lyrics.</tspan>
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 192)">
      <rect width="124" height="32" rx="8" fill="#111A2C" stroke="#1E2D4A" stroke-width="1"/>
      <text x="14" y="20" fill="#E2E8F0" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600">⚡ Multi-Source</text>

      <rect x="134" width="138" height="32" rx="8" fill="#111A2C" stroke="#1E2D4A" stroke-width="1"/>
      <text x="148" y="20" fill="#E2E8F0" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600">📊 CAVA Visualizer</text>

      <rect x="282" width="136" height="32" rx="8" fill="#111A2C" stroke="#1E2D4A" stroke-width="1"/>
      <text x="296" y="20" fill="#E2E8F0" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600">📜 2-Line Couplet</text>
    </g>

    <!-- Quick Start Command Box -->
    <g transform="translate(0, 248)">
      <rect width="418" height="54" rx="10" fill="#080D17" stroke="#1E293B" stroke-width="1.5"/>
      <text x="16" y="32" fill="#10B981" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700">$</text>
      <text x="32" y="32" fill="#F8FAFC" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600">pipx install groovegrab</text>
      <text x="232" y="32" fill="#64748B" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13">&amp;&amp;</text>
      <text x="262" y="32" fill="#38BDF8" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600">groovegrab play</text>
    </g>

    <!-- Metadata Tech Stack Strip -->
    <g transform="translate(0, 330)">
      <text x="0" y="0" fill="#64748B" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5">Python 3.10+  •  FFmpeg Core  •  LRCLIB Sync  •  Mutagen HD</text>
    </g>
  </g>

  <!-- Right Terminal Mockup -->
  <g transform="translate(540, 42)" filter="url(#term-shadow)">
    <!-- Terminal Window Container -->
    <rect width="608" height="376" rx="14" fill="url(#term-window)" stroke="#22314E" stroke-width="1.5"/>

    <!-- Terminal Window Header -->
    <path d="M0,14 C0,6.27 6.27,0 14,0 L594,0 C601.73,0 608,6.27 608,14 L608,38 L0,38 Z" fill="#141E33"/>
    <line x1="0" y1="38" x2="608" y2="38" stroke="#22314E" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="20" cy="19" r="6" fill="#EF4444"/>
    <circle cx="40" cy="19" r="6" fill="#F59E0B"/>
    <circle cx="60" cy="19" r="6" fill="#10B981"/>

    <!-- Window Header Title -->
    <text x="304" y="23" fill="#94A3B8" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="middle">groovegrab play &quot;Tame Impala - Loser&quot;</text>

    <!-- Terminal Content Area -->
    <g transform="translate(24, 62)">
      <!-- Player Status Header -->
      <text x="0" y="0" fill="#38BDF8" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="700">&gt; [1/3] PLAYING TRACK - Loser - Tame Impala</text>
      <rect x="360" y="-12" width="64" height="18" rx="4" fill="#10B981" fill-opacity="0.2"/>
      <text x="392" y="1" fill="#10B981" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">PLAYING</text>
      <text x="436" y="0" fill="#94A3B8" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12">01:24 / 03:44</text>
      
      <!-- Progress Bar Track -->
      <line x1="0" y1="18" x2="560" y2="18" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="18" x2="210" y2="18" stroke="#00F0FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="210" cy="18" r="5" fill="#00F0FF" filter="url(#glow-text)"/>

      <!-- 2-Line Couplet (CLR) Karaoke Lyrics -->
      <g transform="translate(0, 56)">
        <!-- Row 1: First Line (Completed in couplet) -->
        <text x="18" y="0" fill="#94A3B8" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="500">I had to tell ya, it&apos;s now or never</text>

        <!-- Row 2: Second Line (Active singing typewriter with block cursor) -->
        <text x="0" y="28" fill="#00F0FF" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="700">&gt; </text>
        <text x="18" y="28" fill="#F8FAFC" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="700">So much for closure, I lost </text>
        <text x="262" y="28" fill="#00F0FF" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="700">composure</text>
        <rect x="356" y="14" width="9" height="17" fill="#00F0FF" filter="url(#glow-text)"/>
      </g>

      <!-- Bottom Full-Width CAVA Spectrum Equalizer -->
      <g transform="translate(0, 130)">
        <!-- Spectrum Bars (34 bars) -->
        <!-- Bass -->
        <rect x="0" y="100" width="12" height="30" rx="3" fill="url(#cyan-bar)"/>
        <rect x="16" y="75" width="12" height="55" rx="3" fill="url(#cyan-bar)"/>
        <rect x="32" y="45" width="12" height="85" rx="3" fill="url(#cyan-bar)"/>
        <rect x="48" y="20" width="12" height="110" rx="3" fill="url(#cyan-bar)"/>
        <rect x="64" y="10" width="12" height="120" rx="3" fill="url(#bar-grad)"/>
        <rect x="80" y="25" width="12" height="105" rx="3" fill="url(#bar-grad)"/>
        <rect x="96" y="5" width="12" height="125" rx="3" fill="url(#bar-grad)"/>
        <rect x="112" y="30" width="12" height="100" rx="3" fill="url(#bar-grad)"/>
        
        <!-- Low Mids -->
        <rect x="128" y="50" width="12" height="80" rx="3" fill="url(#cyan-bar)"/>
        <rect x="144" y="22" width="12" height="108" rx="3" fill="url(#bar-grad)"/>
        <rect x="160" y="8" width="12" height="122" rx="3" fill="url(#bar-grad)"/>
        <rect x="176" y="35" width="12" height="95" rx="3" fill="url(#bar-grad)"/>
        <rect x="192" y="15" width="12" height="115" rx="3" fill="url(#bar-grad)"/>
        <rect x="208" y="40" width="12" height="90" rx="3" fill="url(#cyan-bar)"/>
        <rect x="224" y="12" width="12" height="118" rx="3" fill="url(#bar-grad)"/>
        <rect x="240" y="55" width="12" height="75" rx="3" fill="url(#cyan-bar)"/>

        <!-- High Mids -->
        <rect x="256" y="25" width="12" height="105" rx="3" fill="url(#bar-grad)"/>
        <rect x="272" y="8" width="12" height="122" rx="3" fill="url(#bar-grad)"/>
        <rect x="288" y="42" width="12" height="88" rx="3" fill="url(#cyan-bar)"/>
        <rect x="304" y="18" width="12" height="112" rx="3" fill="url(#bar-grad)"/>
        <rect x="320" y="35" width="12" height="95" rx="3" fill="url(#bar-grad)"/>
        <rect x="336" y="60" width="12" height="70" rx="3" fill="url(#cyan-bar)"/>
        <rect x="352" y="22" width="12" height="108" rx="3" fill="url(#bar-grad)"/>
        <rect x="368" y="10" width="12" height="120" rx="3" fill="url(#bar-grad)"/>

        <!-- Presence & Treble -->
        <rect x="384" y="45" width="12" height="85" rx="3" fill="url(#cyan-bar)"/>
        <rect x="400" y="28" width="12" height="102" rx="3" fill="url(#bar-grad)"/>
        <rect x="416" y="65" width="12" height="65" rx="3" fill="url(#cyan-bar)"/>
        <rect x="432" y="38" width="12" height="92" rx="3" fill="url(#bar-grad)"/>
        <rect x="448" y="75" width="12" height="55" rx="3" fill="url(#cyan-bar)"/>
        <rect x="464" y="50" width="12" height="80" rx="3" fill="url(#cyan-bar)"/>
        <rect x="480" y="85" width="12" height="45" rx="3" fill="url(#cyan-bar)"/>
        <rect x="496" y="70" width="12" height="60" rx="3" fill="url(#cyan-bar)"/>
        <rect x="512" y="95" width="12" height="35" rx="3" fill="url(#cyan-bar)"/>
        <rect x="528" y="105" width="12" height="25" rx="3" fill="url(#cyan-bar)"/>
        <rect x="544" y="115" width="12" height="15" rx="3" fill="url(#cyan-bar)"/>

        <!-- Peak Indicator Dots -->
        <circle cx="70" cy="4" r="2.5" fill="#EF4444"/>
        <circle cx="102" cy="0" r="2.5" fill="#EF4444"/>
        <circle cx="166" cy="2" r="2.5" fill="#EF4444"/>
        <circle cx="230" cy="6" r="2.5" fill="#EF4444"/>
        <circle cx="278" cy="2" r="2.5" fill="#EF4444"/>
        <circle cx="374" cy="4" r="2.5" fill="#EF4444"/>

        <!-- Spectrum Baseline & Reflection Grid -->
        <line x1="0" y1="131" x2="560" y2="131" stroke="#22314E" stroke-width="1.5"/>
        <line x1="0" y1="135" x2="560" y2="135" stroke="#152033" stroke-width="1" stroke-dasharray="2,4"/>
      </g>
    </g>
  </g>
</svg>
